name: JARVIS Video Architecture Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned voice runtime
        shell: powershell
        run: |
          $sha = git -C personal-jarvis rev-parse HEAD
          if ($sha.Trim() -ne 'e70b61fc30eff54857e8a2d183ce22f40985f3a0') { throw "Unexpected upstream $sha" }
      - name: Parse launcher
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\run-local.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Verify cloned voice assets
        shell: powershell
        run: |
          @('voice/jarvis.mp3','voice/jarvis.txt','voice/apply_voice.py') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing $_" }
          }

  brain-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension dependencies
        run: npm install --no-audit --no-fund
      - name: Static check and bundle webviews
        run: npm run check
      - name: Package VSIX
        run: npm run package
      - name: Verify VSIX
        run: test -s jarvis-brain.vsix
