name: JARVIS Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend + AI + Voice contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "numpy>=1.26,<3"
          python -m pip check
      - name: Compile every Python source
        run: python -m compileall -q jarvis backend local_voice tests
      - name: Run complete Python test suite
        run: pytest -q

  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run build

  voice-ai-endurance:
    name: Voice + AI + operations endurance x10
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice/AI test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "numpy>=1.26,<3"
          python -m pip check
      - name: Run voice, AI and operational suite ten consecutive times
        shell: bash
        run: |
          set -euo pipefail
          TESTS=(
            tests/test_voice_ai_endurance.py
            tests/test_operational_acceptance.py
            tests/test_realtime_pipeline.py
            tests/test_audio_guards.py
            tests/test_conversation_voice.py
            tests/test_voice_think_filter.py
            tests/test_cosyvoice_service.py
            tests/test_cloud_brain.py
            tests/test_core_router.py
            tests/test_local_model_pool.py
          )
          for pass in $(seq 1 10); do
            echo "=== VOICE + AI + OPERATIONS endurance ${pass}/10 ==="
            pytest -q "${TESTS[@]}"
          done

  windows-runtime:
    name: Windows voice/runtime/operations smoke x3
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows listener dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-listener.txt
          python -m pip install pyautogui pillow
          python -m pip check
      - name: Compile Python on Windows
        run: python -m compileall -q jarvis backend local_voice tests
      - name: Import stable desktop and voice surfaces
        shell: pwsh
        run: |
          python -c "import jarvis.desktop_stable; import jarvis.desktop; import jarvis.voice.stt_stable; import jarvis.voice.wake_stable; import local_voice.cosyvoice_server; print('Windows runtime imports OK')"
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $allErrors += "$($_.FullName):$($err.Extent.StartLineNumber): $($err.Message)"
              }
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "All PowerShell scripts parsed successfully."
      - name: Run Windows voice/audio/AI/operations tests three times
        shell: pwsh
        run: |
          $tests = @(
            'tests/test_voice_ai_endurance.py',
            'tests/test_operational_acceptance.py',
            'tests/test_audio_guards.py',
            'tests/test_conversation_voice.py',
            'tests/test_voice_think_filter.py',
            'tests/test_persistent_runtime.py',
            'tests/test_realtime_pipeline.py',
            'tests/test_api_smoke.py',
            'tests/test_cosyvoice_service.py',
            'tests/test_cloud_brain.py',
            'tests/test_core_router.py',
            'tests/test_local_model_pool.py'
          )
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "=== WINDOWS VOICE + AI + OPERATIONS $pass/3 ==="
            pytest -q $tests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  stress:
    name: Repeat suite for state leaks/flakiness
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "numpy>=1.26,<3"
      - name: Run complete suite three consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "=== JARVIS stress pass ${pass}/3 ==="
            pytest -q
          done

  snapshot:
    name: Tested repository snapshot
    if: github.event_name == 'push'
    needs: [backend, frontend, voice-ai-endurance, windows-runtime, stress]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4
      - name: Remove git metadata and local-only caches
        run: |
          rm -rf .git .pytest_cache __pycache__
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
      - name: Upload tested JARVIS snapshot
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-main-full-tested
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
