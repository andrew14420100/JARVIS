name: JARVIS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "numpy>=1.26,<3"
      - name: Compile all Python sources
        run: python -m compileall -q jarvis backend local_voice
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run build

  snapshot:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4
      - name: Remove git metadata and local-only caches
        run: |
          rm -rf .git .pytest_cache __pycache__
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
      - name: Upload tested JARVIS snapshot
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-main-tested
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
