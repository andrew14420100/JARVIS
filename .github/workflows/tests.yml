name: JARVIS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend entrypoint
        run: >-
          python -m py_compile
          backend/server.py
          jarvis/app.py
          jarvis/desktop.py
          jarvis/desktop_stable.py
          jarvis/agent/orchestrator.py
          jarvis/agent/stable_orchestrator.py
          jarvis/brain/lmstudio.py
          jarvis/brain/cloud.py
          jarvis/voice/stt_stable.py
          jarvis/voice/wake_stable.py
          jarvis/voice/cosyvoice_stable.py
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run build
