[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-assistant"
version = "0.1.0"
description = "Local JARVIS-style desktop assistant powered by Qwen through LM Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
jarvis-cli = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
